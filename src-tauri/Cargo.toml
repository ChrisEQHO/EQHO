[package]
name = "eqho-player"
version = "1.0.1"
description = "EQHO Player Desktop"
authors = ["EQHO"]
edition = "2021"
rust-version = "1.77.2"

# The desktop wrapper is intentionally thin: it is a secure native window that
# loads the live production web app (https://www.eqho-player.com). It does NOT
# bundle the Next.js server routes or the mobile static export.

[lib]
name = "eqho_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
